version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mydb
    ports:
      - "3307:3306"  # <--- Cambia el puerto izquierdo a 3307 (o el que esté libre)
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: .
    container_name: fastapi_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:password@db:3306/mydb
    depends_on:
      - db

volumes:
  mysql_data:
